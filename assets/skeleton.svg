<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <style>
    .skel-body { animation: skelBreath 2.2s ease-in-out infinite alternate; transform-origin: bottom center; }
    .skel-bow { animation: bowPull 1.8s ease-in-out infinite alternate; transform-origin: 40px 70px; }
    .skel-eyes { animation: eyeRed 4s infinite alternate; }
    @keyframes skelBreath { 0% { transform: translateY(0px); } 100% { transform: translateY(-3px); } }
    @keyframes bowPull { 0% { transform: rotate(0deg) scale(1); } 100% { transform: rotate(-5deg) scale(1.05); } }
    @keyframes eyeRed { 0%, 80% { fill: #111; } 90%, 100% { fill: #ff4444; } }
  </style>
  <g class="skel-body">
    <!-- Shadow -->
    <ellipse cx="60" cy="150" rx="30" ry="7" fill="#000000" opacity="0.35"/>

    <!-- Legs (Bones) -->
    <rect x="46" y="105" width="8" height="38" fill="#d8d8d8" rx="1"/>
    <rect x="66" y="105" width="8" height="38" fill="#b5b5b5" rx="1"/>
    <!-- Feet -->
    <rect x="42" y="140" width="14" height="6" fill="#8c8c8c" rx="1"/>
    <rect x="64" y="140" width="14" height="6" fill="#8c8c8c" rx="1"/>

    <!-- Spine & Ribs -->
    <rect x="56" y="58" width="8" height="48" fill="#b5b5b5"/>
    <!-- Ribs -->
    <rect x="40" y="62" width="40" height="6" fill="#e6e6e6" rx="1"/>
    <rect x="42" y="72" width="36" height="6" fill="#d8d8d8" rx="1"/>
    <rect x="44" y="82" width="32" height="6" fill="#c0c0c0" rx="1"/>
    <rect x="46" y="92" width="28" height="6" fill="#a0a0a0" rx="1"/>

    <!-- Head -->
    <rect x="36" y="14" width="48" height="42" fill="#e6e6e6" rx="3"/>
    <rect x="40" y="18" width="40" height="34" fill="#ffffff" rx="2"/>

    <!-- Eye Sockets -->
    <rect x="44" y="28" width="12" height="12" class="skel-eyes" fill="#111" rx="1"/>
    <rect x="64" y="28" width="12" height="12" class="skel-eyes" fill="#111" rx="1"/>
    <!-- Nose socket -->
    <rect x="57" y="38" width="6" height="6" fill="#333"/>
    <!-- Mouth / Teeth -->
    <rect x="46" y="46" width="28" height="6" fill="#999"/>
    <line x1="51" y1="46" x2="51" y2="52" stroke="#fff" stroke-width="2"/>
    <line x1="60" y1="46" x2="60" y2="52" stroke="#fff" stroke-width="2"/>
    <line x1="69" y1="46" x2="69" y2="52" stroke="#fff" stroke-width="2"/>

    <!-- Bow & Arms -->
    <g class="skel-bow">
      <!-- Left Arm holding bow -->
      <rect x="26" y="60" width="18" height="8" fill="#d8d8d8" rx="1"/>
      <rect x="22" y="66" width="8" height="24" fill="#b5b5b5" rx="1"/>
      <!-- Bow Wooden Curve -->
      <path d="M 22 45 Q 10 75 22 105" fill="none" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>
      <!-- Bow String -->
      <line x1="22" y1="45" x2="22" y2="105" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,2"/>
      <!-- Arrow -->
      <line x1="16" y1="75" x2="45" y2="75" stroke="#d4af37" stroke-width="2.5"/>
      <polygon points="16,72 10,75 16,78" fill="#ccc"/>
    </g>

    <!-- Badge Tag -->
    <rect x="24" y="2" width="72" height="14" fill="#161b22" stroke="#ff5555" stroke-width="1" rx="4"/>
    <text x="60" y="12" fill="#ff5555" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">🏹 SKELETON</text>
  </g>
</svg>
