<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <style>
    .zombie-body { animation: bodySway 2s ease-in-out infinite alternate; transform-origin: bottom center; }
    .zombie-arm { animation: armRaise 1.5s ease-in-out infinite alternate; transform-origin: 30px 65px; }
    .zombie-eyes { animation: eyeGlow 3s ease-in-out infinite alternate; }
    @keyframes bodySway { 0% { transform: rotate(-2deg); } 100% { transform: rotate(2deg); } }
    @keyframes armRaise { 0% { transform: rotate(0deg); } 100% { transform: rotate(-8deg) translateY(-2px); } }
    @keyframes eyeGlow { 0%, 100% { fill: #0a0a0a; } 50% { fill: #55ff55; } }
  </style>
  <g class="zombie-body">
    <!-- Shadow -->
    <ellipse cx="60" cy="150" rx="35" ry="8" fill="#000000" opacity="0.3"/>
    
    <!-- Legs -->
    <rect x="42" y="105" width="16" height="40" fill="#1b2a47" rx="1"/>
    <rect x="62" y="105" width="16" height="40" fill="#253a60" rx="1"/>
    <!-- Shoes -->
    <rect x="40" y="140" width="18" height="8" fill="#111" rx="1"/>
    <rect x="62" y="140" width="18" height="8" fill="#111" rx="1"/>

    <!-- Torso (Shirt) -->
    <rect x="36" y="55" width="48" height="52" fill="#2b5a84" rx="2"/>
    <rect x="44" y="60" width="32" height="40" fill="#356d9e" rx="1"/>
    <!-- Collar detail -->
    <polygon points="50,55 60,65 70,55" fill="#2e6f40"/>

    <!-- Head -->
    <rect x="34" y="12" width="52" height="45" fill="#2e6f40" rx="3"/>
    <!-- Hair / Top head shading -->
    <rect x="34" y="12" width="52" height="12" fill="#235430"/>
    <rect x="38" y="24" width="44" height="28" fill="#3b8750" rx="2"/>

    <!-- Eyes -->
    <rect x="42" y="28" width="10" height="10" class="zombie-eyes" fill="#0a0a0a" rx="1"/>
    <rect x="68" y="28" width="10" height="10" class="zombie-eyes" fill="#0a0a0a" rx="1"/>
    <!-- Nose / Mouth -->
    <rect x="54" y="38" width="12" height="6" fill="#1c4226"/>

    <!-- Arms extended forward (Zombie style) -->
    <g class="zombie-arm">
      <!-- Right Arm (Extended) -->
      <rect x="20" y="58" width="22" height="16" fill="#2b5a84" rx="2"/>
      <rect x="8" y="58" width="16" height="16" fill="#3b8750" rx="2"/>
      <!-- Left Arm (Extended) -->
      <rect x="78" y="58" width="22" height="16" fill="#253a60" rx="2"/>
      <rect x="96" y="58" width="16" height="16" fill="#2e6f40" rx="2"/>
    </g>

    <!-- Badge Tag -->
    <rect x="28" y="2" width="64" height="14" fill="#161b22" stroke="#55ff55" stroke-width="1" rx="4"/>
    <text x="60" y="12" fill="#55ff55" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">🧟 ZOMBIE</text>
  </g>
</svg>
