<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 170" width="140" height="170">
  <style>
    .warden-body { animation: wardenHeavy 3s ease-in-out infinite alternate; transform-origin: bottom center; }
    .sculk-heart { animation: heartBeat 0.8s ease-in-out infinite alternate; transform-origin: 70px 85px; }
    .warden-horns { animation: hornGlow 2.5s ease-in-out infinite alternate; }
    @keyframes wardenHeavy { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-4px) rotate(1deg); } }
    @keyframes heartBeat { 0% { transform: scale(0.9); opacity: 0.7; fill: #00b4d8; } 100% { transform: scale(1.15); opacity: 1; fill: #00f5d4; filter: drop-shadow(0 0 8px #00f5d4); } }
    @keyframes hornGlow { 0% { fill: #0e3e46; } 50% { fill: #00f5d4; } 100% { fill: #00b4d8; } }
  </style>
  <g class="warden-body">
    <!-- Shadow -->
    <ellipse cx="70" cy="160" rx="45" ry="9" fill="#000000" opacity="0.45"/>

    <!-- Massive Legs -->
    <rect x="42" y="112" width="22" height="42" fill="#0b1a20" rx="3"/>
    <rect x="76" y="112" width="22" height="42" fill="#112c36" rx="3"/>
    <rect x="38" y="148" width="26" height="10" fill="#071216" rx="2"/>
    <rect x="76" y="148" width="26" height="10" fill="#071216" rx="2"/>

    <!-- Massive Torso -->
    <rect x="32" y="52" width="76" height="64" fill="#0f2630" rx="4"/>
    <rect x="38" y="58" width="64" height="52" fill="#143442" rx="3"/>

    <!-- Sculk Ribs / Ribcage cavity -->
    <rect x="48" y="66" width="44" height="38" fill="#061014" rx="3"/>
    <!-- Sculk Heart Core -->
    <circle cx="70" cy="85" r="14" class="sculk-heart"/>
    <circle cx="70" cy="85" r="7" fill="#ffffff" opacity="0.9"/>

    <!-- Huge Sculk Horns / Antennas -->
    <g class="warden-horns">
      <!-- Left Horn -->
      <path d="M 40 25 L 20 10 L 25 28 L 35 30 Z" />
      <path d="M 20 10 L 10 5 L 15 18 Z" />
      <!-- Right Horn -->
      <path d="M 100 25 L 120 10 L 115 28 L 105 30 Z" />
      <path d="M 120 10 L 130 5 L 125 18 Z" />
    </g>

    <!-- Head (Eyeless Sculk Head) -->
    <rect x="38" y="14" width="64" height="42" fill="#0b1a20" rx="4"/>
    <rect x="44" y="18" width="52" height="34" fill="#13303c" rx="3"/>
    <!-- Sculk Speckles on face -->
    <rect x="48" y="22" width="8" height="8" fill="#00f5d4" opacity="0.8" rx="1"/>
    <rect x="84" y="24" width="6" height="6" fill="#00f5d4" opacity="0.8" rx="1"/>
    <rect x="62" y="20" width="14" height="6" fill="#00b4d8" opacity="0.7" rx="1"/>

    <!-- Mouth (Open Void Cavity) -->
    <rect x="52" y="34" width="36" height="14" fill="#040a0d" rx="2"/>
    <!-- Teeth / Sculk Fangs -->
    <polygon points="56,34 60,40 64,34" fill="#00f5d4"/>
    <polygon points="76,34 80,40 84,34" fill="#00f5d4"/>

    <!-- Huge Arms -->
    <rect x="14" y="56" width="20" height="54" fill="#0b1a20" rx="3"/>
    <rect x="106" y="56" width="20" height="54" fill="#112c36" rx="3"/>
    <rect x="10" y="104" width="24" height="14" fill="#00f5d4" opacity="0.6" rx="2"/>
    <rect x="106" y="104" width="24" height="14" fill="#00f5d4" opacity="0.6" rx="2"/>

    <!-- Badge Tag -->
    <rect x="30" y="1" width="80" height="14" fill="#161b22" stroke="#00f5d4" stroke-width="1" rx="4"/>
    <text x="70" y="11" fill="#00f5d4" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">👹 THE WARDEN</text>
  </g>
</svg>
