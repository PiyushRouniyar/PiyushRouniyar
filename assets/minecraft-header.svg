<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient: Sky to Nether to End Void -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142334" />
      <stop offset="50%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>

    <!-- Green Glow for Name -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .header-bg { fill: url(#bgGrad); rx: 12px; }
    .header-title {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 38px;
      font-weight: 900;
      fill: #55FF55;
      letter-spacing: 4px;
      animation: textPulse 3s ease-in-out infinite alternate;
    }
    .header-sub {
      font-family: 'Courier New', Courier, monospace, sans-serif;
      font-size: 14px;
      font-weight: bold;
      fill: #aab8c5;
      letter-spacing: 3px;
    }

    @keyframes textPulse {
      0% { fill: #55FF55; filter: drop-shadow(0 0 4px #3C8527); }
      100% { fill: #70FF70; filter: drop-shadow(0 0 12px #55FF55); }
    }

    /* Floating mob animations */
    .mob-steve { animation: floatSteve 2.5s ease-in-out infinite alternate; }
    .mob-creeper { animation: floatCreeper 2.2s ease-in-out infinite alternate; }
    .mob-wither { animation: floatWither 3s ease-in-out infinite alternate; }
    .mob-dragon { animation: floatDragon 3.5s ease-in-out infinite alternate; }

    @keyframes floatSteve { 0% { transform: translateY(0px); } 100% { transform: translateY(-6px); } }
    @keyframes floatCreeper { 0% { transform: translateY(0px); } 100% { transform: translateY(-5px); } }
    @keyframes floatWither { 0% { transform: translateY(0px) rotate(-1deg); } 100% { transform: translateY(-8px) rotate(1deg); } }
    @keyframes floatDragon { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(-10px) scale(1.03); } }
  </style>

  <!-- Background -->
  <rect class="header-bg" width="1000" height="240" stroke="#30363d" stroke-width="2"/>
  
  <!-- Dirt/Grass Ground Strip at Bottom -->
  <rect x="0" y="210" width="1000" height="8" fill="#55ff55"/>
  <rect x="0" y="218" width="1000" height="22" fill="#8b5a2b" rx="2"/>

  <!-- Left: STEVE (Player) -->
  <g class="mob-steve" transform="translate(60, 95)">
    <!-- Shadow -->
    <ellipse cx="25" cy="115" rx="20" ry="5" fill="#000" opacity="0.4"/>
    <!-- Head -->
    <rect x="5" y="10" width="40" height="36" fill="#c49a6c" rx="2"/>
    <rect x="5" y="10" width="40" height="10" fill="#4a2e13"/> <!-- Hair -->
    <rect x="11" y="24" width="8" height="8" fill="#fff"/>
    <rect x="15" y="24" width="4" height="8" fill="#2b5a84"/> <!-- Eye Left -->
    <rect x="29" y="24" width="8" height="8" fill="#fff"/>
    <rect x="33" y="24" width="4" height="8" fill="#2b5a84"/> <!-- Eye Right -->
    <rect x="19" y="34" width="12" height="6" fill="#7a4e28"/> <!-- Nose/Mouth -->
    <!-- Torso (Shirt) -->
    <rect x="5" y="46" width="40" height="38" fill="#00a8a8" rx="2"/>
    <!-- Arms -->
    <rect x="-11" y="46" width="14" height="38" fill="#008888" rx="2"/>
    <rect x="47" y="46" width="14" height="38" fill="#008888" rx="2"/>
    <!-- Pants -->
    <rect x="9" y="84" width="15" height="28" fill="#1b2a47" rx="1"/>
    <rect x="26" y="84" width="15" height="28" fill="#1b2a47" rx="1"/>
  </g>

  <!-- Left-Center: CREEPER -->
  <g class="mob-creeper" transform="translate(170, 105)">
    <!-- Shadow -->
    <ellipse cx="20" cy="105" rx="18" ry="4" fill="#000" opacity="0.4"/>
    <!-- Head -->
    <rect x="0" y="10" width="40" height="40" fill="#3c8527" rx="2"/>
    <!-- Face -->
    <rect x="8" y="20" width="8" height="8" fill="#000"/> <!-- Eye -->
    <rect x="24" y="20" width="8" height="8" fill="#000"/> <!-- Eye -->
    <rect x="16" y="28" width="8" height="12" fill="#000"/> <!-- Mouth Center -->
    <rect x="12" y="32" width="16" height="12" fill="#000"/> <!-- Mouth Mouth -->
    <!-- Body -->
    <rect x="6" y="50" width="28" height="36" fill="#2e6b1f" rx="1"/>
    <!-- Legs -->
    <rect x="2" y="86" width="14" height="18" fill="#1e4714"/>
    <rect x="24" y="86" width="14" height="18" fill="#1e4714"/>
  </g>

  <!-- Center Text & Name Banner -->
  <g transform="translate(500, 110)" text-anchor="middle">
    <!-- Outer Shield Frame -->
    <rect x="-240" y="-70" width="480" height="95" fill="#161b22" opacity="0.85" stroke="#3C8527" stroke-width="2" rx="8"/>
    
    <!-- Player Title -->
    <text x="0" y="-20" class="header-title">PIYUSH ROUNIYAR</text>
    <text x="0" y="12" class="header-sub">FULL-STACK &amp; AI ENGINEER</text>
    
    <!-- Badges Row -->
    <g transform="translate(0, 32)">
      <rect x="-160" y="0" width="100" height="16" fill="#2b5a84" rx="3"/>
      <text x="-110" y="12" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">⚔️ STEVE</text>

      <rect x="-50" y="0" width="100" height="16" fill="#3c8527" rx="3"/>
      <text x="0" y="12" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">💥 CREEPER</text>

      <rect x="60" y="0" width="100" height="16" fill="#aa00aa" rx="3"/>
      <text x="110" y="12" fill="#fff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">🐉 DRAGON</text>
    </g>
  </g>

  <!-- Right-Center: WITHER -->
  <g class="mob-wither" transform="translate(760, 90)">
    <!-- Shadow -->
    <ellipse cx="30" cy="115" rx="22" ry="5" fill="#000" opacity="0.4"/>
    <!-- Center Head -->
    <rect x="15" y="10" width="30" height="30" fill="#1e222a" rx="2"/>
    <rect x="21" y="20" width="6" height="6" fill="#00f5d4"/> <!-- Eyes -->
    <rect x="33" y="20" width="6" height="6" fill="#00f5d4"/>
    <rect x="25" y="30" width="10" height="4" fill="#000"/>
    <!-- Left Head -->
    <rect x="-5" y="20" width="20" height="20" fill="#14171d" rx="2"/>
    <rect x="0" y="26" width="4" height="4" fill="#00f5d4"/>
    <rect x="8" y="26" width="4" height="4" fill="#00f5d4"/>
    <!-- Right Head -->
    <rect x="45" y="20" width="20" height="20" fill="#14171d" rx="2"/>
    <rect x="50" y="26" width="4" height="4" fill="#00f5d4"/>
    <rect x="58" y="26" width="4" height="4" fill="#00f5d4"/>
    <!-- Ribs / Spine Body -->
    <rect x="23" y="40" width="14" height="45" fill="#14171d"/>
    <rect x="10" y="46" width="40" height="5" fill="#30363d"/>
    <rect x="12" y="55" width="36" height="5" fill="#30363d"/>
    <rect x="15" y="64" width="30" height="5" fill="#30363d"/>
  </g>

  <!-- Far Right: ENDER DRAGON -->
  <g class="mob-dragon" transform="translate(880, 80)">
    <!-- Dragon Head & Wings -->
    <!-- Wing Left -->
    <path d="M 30 40 L 0 10 L 15 50 Z" fill="#aa00aa" opacity="0.8"/>
    <!-- Wing Right -->
    <path d="M 50 40 L 80 10 L 65 50 Z" fill="#aa00aa" opacity="0.8"/>
    <!-- Dragon Head -->
    <rect x="25" y="35" width="30" height="35" fill="#0d0d0d" rx="3"/>
    <rect x="29" y="45" width="6" height="6" fill="#ff00ff"/> <!-- Glowing Purple Eye -->
    <rect x="45" y="45" width="6" height="6" fill="#ff00ff"/>
    <!-- Dragon Snout -->
    <rect x="28" y="58" width="24" height="15" fill="#181818" rx="1"/>
    <!-- Dragon Body Spine -->
    <rect x="35" y="70" width="10" height="35" fill="#111"/>
  </g>
</svg>
